<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">External clients connect through a Socket_X broker, which routes validated commands down through a risk and portfolio gate to BrokerContract, then to either a Paper or Live adapter. Signals and fills relay back up the same path.</desc>
