<!doctype html>
<html lang="en" class="bg-[#020617]">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/corex.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CoreX Industrial Trading Engine - Low Latency Execution Environment" />
    <meta name="theme-color" content="#020617" />
    <title>CoreX Engine | Industrial Runtime</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:ital,wght@0,400;0,800;1,400&display=swap" rel="stylesheet">

    <style>
      body {
        margin: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
      }

      #boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      }

      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      .logo-pulse {
        width: 64px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s infinite ease-in-out;
      }

      .loader-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.5em;
        color: #3b82f6;
      }

      @keyframes pulse {
        0% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 0px rgba(59, 130, 246, 0)); }
        50% { transform: scale(1.05); opacity: 0.7; filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5)); }
        100% { transform: scale(1); opacity: 1; filter: drop-shadow(0 0 0px rgba(59, 130, 246, 0)); }
      }
    </style>
  </head>
  <body>
    <div id="boot-loader">
      <div class="loader-content">
        <div class="logo-pulse">
          <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <path d="M48 16 A24 24 0 1 0 48 48 L39 39 A11 11 0 1 1 39 25 Z" fill="#3b82f6"/>
            <g fill="#3b82f6">
              <rect x="27" y="0" width="10" height="9" rx="1"/>
              <rect x="27" y="55" width="10" height="9" rx="1"/>
              <rect x="0" y="27" width="9" height="10" rx="1"/>
              <rect x="10" y="10" width="10" height="9" rx="1" transform="rotate(45 15 15)"/>
              <rect x="10" y="45" width="10" height="9" rx="1" transform="rotate(-45 15 49)"/>
            </g>
          </svg>
        </div>
        <div class="loader-text">Initializing CoreX Engine</div>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      window.addEventListener('load', () => {
        const loader = document.getElementById('boot-loader');
        if (loader) {
          setTimeout(() => {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.5s ease';
            setTimeout(() => loader.remove(), 500);
          }, 600);
        }
      });
    </script>
  </body>
</html>
